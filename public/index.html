<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Options Tracker</title>
  <meta name="description" content="Track options positions and underlying prices." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Options Tracker</h1>
      <p class="subtitle">Positions &amp; underlying prices</p>
    </header>

    <section id="positions" class="positions" aria-live="polite">
      <!-- Position cards are rendered by app.js -->
    </section>

    <footer class="footer">
      <p id="status-line">Loading prices…</p>
      <p class="fineprint">Prices via Yahoo Finance / Stooq through the site's own proxy. Not investment advice.</p>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
