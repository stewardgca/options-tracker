<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio Tracker</title>
  <meta name="description" content="Track portfolio positions and underlying prices." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Portfolio Tracker</h1>
      <p class="subtitle">Positions &amp; underlying prices</p>
    </header>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th class="num">Price</th>
            <th class="num">Change</th>
            <th>Position</th>
            <th class="num">Value</th>
            <th class="num">P&amp;L</th>
            <th>Options</th>
          </tr>
        </thead>
        <tbody id="positions" aria-live="polite">
          <!-- Rows are rendered by app.js -->
        </tbody>
      </table>
    </div>

    <footer class="footer">
      <p id="status-line">Loading prices…</p>
      <p class="fineprint">Prices via Hyperliquid — MU, NVDA, GOLD on xyz; QQQ via QQQX/USDC and SPY via SPYX/USDC spot — with Yahoo Finance as the close reference. Not investment advice.</p>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
